<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <title>VELO GOURMET — Uni Projekt</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/css/splide.min.css">

    <style>
        /* ==========================================
           1. SETUP & CSS-VARIABLEN
           ========================================== */
        @font-face {
            font-family: 'Crackman';
            /* Hier wird später die echte Crackman.ttf verlinkt. 
               Solange nutzen wir einen kraftvollen Gaming-Fallback. */
            src: local('Impact'), local('Arial Black'), sans-serif; 
        }

        :root {
            --bg-sand: #f4f1ea;
            --bg-sage: #e2e8dd;
            --brand-green: #c1ff72;
            --brand-rose: #FFD6D8;
            --text-dark: #1b241e;
            --card-white: rgba(255, 255, 255, 0.85);
            
            --svg-bg-hero: url('cs.svg');
            --svg-bg-content: url('st.svg');
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%; height: 100%; position: fixed; top: 0; left: 0; overflow: hidden;
            background-color: var(--bg-sand);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-dark); -webkit-text-size-adjust: 100%;
        }

        .scroll-container {
            width: 100%; height: 100%; overflow-y: scroll; overflow-x: hidden;
            scroll-snap-type: y mandatory; scroll-behavior: smooth; -webkit-overflow-scrolling: touch;
        }

        .section {
            height: 100%; width: 100%; scroll-snap-align: start; scroll-snap-stop: always;
            position: relative; display: flex; flex-direction: column; justify-content: center;
            align-items: center; padding: 20px; overflow: hidden;
        }

        /* ==========================================
           2. HERO SEKTION & LAYER
           ========================================== */
        .hero-section { background-color: var(--bg-sand); z-index: 1; }
        .hero-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 120%;
            background-image: var(--svg-bg-hero); background-size: cover;
            background-position: center center; background-repeat: no-repeat;
            z-index: 1; will-change: transform; filter: contrast(95%) brightness(98%);
        }
        .hero-content {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 2; width: 100%;
            display: flex; justify-content: center; align-items: center; will-change: transform, opacity;
            transition: transform 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94), opacity 0.25s ease-out;
        }
        .logo-wrapper { display: flex; justify-content: center; align-items: center; width: 100%; padding: 0 10px; }
        .logo-img {
            aspect-ratio: 1 / 1; width: clamp(250px, 80vw, 500px); height: auto; object-fit: contain;
            filter: drop-shadow(0 25px 45px rgba(0,0,0,0.22)); animation: fadeInMorph 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @media (min-width: 768px) { .logo-img { width: clamp(400px, 75vmin, 800px); height: clamp(400px, 75vmin, 800px); } }

        .swipe-hint {
            position: absolute; bottom: max(30px, env(safe-area-inset-bottom)); z-index: 2;
            font-size: 13px; letter-spacing: 2px; text-transform: uppercase; font-weight: 600;
            color: var(--text-dark); background: rgba(255, 255, 255, 0.85); padding: 10px 22px;
            border-radius: 30px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            animation: floatBounce 2s infinite ease-in-out; will-change: transform, opacity; transition: opacity 0.25s ease-out;
        }
        @supports (backdrop-filter: blur(8px)) { .swipe-hint { background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(8px); } }

        .layer-content {
            background-color: var(--bg-sand); background-image: var(--svg-bg-content);
            background-size: cover; background-position: center top; background-repeat: no-repeat;
            box-shadow: 0 -25px 50px rgba(0,0,0,0.12); z-index: 3;
        }
        .organic-edge-wrapper {
            position: absolute; top: 0; left: 0; width: 100%; height: 60px;
            transform: translateY(-99%); pointer-events: none; overflow: hidden;
        }
        .liquid-path { fill: var(--bg-sand); d: path("M0,60 C150,15 350,50 500,20 L500,60 L0,60 Z"); }

        .actions { display: flex; flex-direction: column; gap: 20px; width: 100%; max-width: 340px; z-index: 2; margin-top: 40px; }
        .artist-btn { display: block; width: 100%; text-decoration: none; transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.4s ease; cursor: pointer; position: relative; -webkit-tap-highlight-color: transparent;}
        .artist-btn::after { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 10; }
        .artist-btn:hover { transform: scale(1.04) translateY(-4px); filter: drop-shadow(0 15px 25px rgba(0,0,0,0.15)); }
        .artist-btn:active { transform: scale(0.97) translateY(2px); filter: drop-shadow(0 5px 10px rgba(0,0,0,0.1)); transition: transform 0.1s ease-out; }
        .artist-btn svg { width: 100%; height: auto; filter: drop-shadow(0 8px 16px rgba(0,0,0,0.08)); }
        .btn-text { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }

        @keyframes fadeInMorph { 0% { opacity: 0; transform: translate(-50%, -50%) scale(0.9); filter: blur(8px); } 100% { opacity: 1; transform: translate(-50%, -50%) scale(1); filter: blur(0); } }
        @keyframes floatBounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(8px); } }
