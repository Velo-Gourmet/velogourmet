<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velo Gourmet</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            color: #333;
            display: flex;
            flex-direction: column;
            /* 100dvh passt sich dynamisch an die Handy-Menüleisten an */
            min-height: 100dvh;
            padding: 15px;
        }
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .logo {
            max-width: 220px; /* Minimal verkleinert */
            max-height: 40dvh; /* Verhindert, dass das Logo vertikal zu viel Platz frisst */
            height: auto;
            object-fit: contain;
            margin-bottom: 15px;
        }
        p {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 20px;
            padding: 0 10px;
        }
        .button-bar {
            display: flex;
            gap: 15px;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            padding-bottom: 10px; /* Abstand nach unten reduziert */
        }
        .btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            text-decoration: none;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .btn-contact {
            background-color: #27ae60;
            color: white;
        }
        .btn-gallery {
            background-color: #34495e;
            color: white;
        }
    </style>
</head>
<body>

    <div class="main-content">
        <img src="1541.png" alt="Velo Gourmet Logo" class="logo">
        <p>Feinstes Essen, CO2-frei direkt zu dir geliefert.</p>
    </div>

    <div class="button-bar">
        <a href="mailto:deine-email@example.com" class="btn btn-contact">Kontakt</a>
        <a href="#galerie" class="btn btn-gallery">Galerie</a>
    </div>

</body>
</html>
