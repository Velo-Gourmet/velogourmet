<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parallax Test</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        /* Kein Scroll-Snap für diesen Test, um Konflikte auszuschließen */
        body {
            font-family: sans-serif;
            background: #f4f1ea;
        }

        .hero {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background: #e2e8dd;
            overflow: hidden;
        }

        .logo {
            width: 250px;
            z-index: 2;
            /* Wichtig für die flüssige Bewegung */
            will-change: transform;
        }

        .content {
            height: 100vh;
            background: #1b241e;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
        }
    </style>
</head>
<body>

    <section class="hero">
        <!-- Nutzen wir dein lo.svg. Falls nicht vorhanden, zeigt er den Alt-Text -->
        <img src="lo.svg" alt="VELO GOURMET LOGO" class="logo" id="parallax-logo">
    </section>

    <section class="content">
        <p>Zweite Sektion (Erfolgstest)</p>
    </section>

    <script>
        const logo = document.getElementById('parallax-logo');

        document.addEventListener('scroll', () => {
            const value = window.scrollY;
            // Verschiebt das Logo beim Scrollen spürbar nach unten
            logo.style.transform = `translateY(${value * 0.5}px)`;
        });
    </script>
</body>
</html>
