<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>VELO GOURMET — Uni Projekt</title>
    <style>
        /* ==========================================
           1. SETUP & CSS-VARIABLEN
           ========================================== */
        :root {
            --bg-sand: #f4f1ea;
            --bg-sage: #e2e8dd;
            --brand-green: #c1ff72;
            --brand-rose: #FFD6D8;
            --text-dark: #1b241e;
            --card-white: rgba(255, 255, 255, 0.85);
            
            --svg-bg-hero: url('cs.svg');
            --svg-bg-content: url('st.svg');
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* 2. INTUITIVES SCROLL-SNAP */
        html {
            scroll-behavior: smooth;
            scroll-snap-type: y mandatory;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--text-dark); /* Dunkler Hintergrund verstärkt den Tiefeneffekt */
            color: var(--text-dark);
            overflow-x: hidden;
        }

        .section {
            height: 100dvh;
            width: 100vw;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        /* ==========================================
           3. HERO SEKTION (Mit Stacking & Depth)
           ========================================== */
        .hero-section {
            background-color: var(--text-dark);
            justify-content: center;
            align-items: center;
        }

        .hero-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 120%;
            background-image: var(--svg-bg-hero);
            background-size: cover;
            background-position: center;
            z-index: 1;
            filter: contrast(95%) brightness(98%);
        }

        .hero-content {
            z-index: 2;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 0 20px;
        }

        .logo-img {
            width: clamp(280px, 60vw, 650px);
            height: auto;
            max-height: 70dvh;
            object-fit: contain;
            filter: drop-shadow(0 12px 24px rgba(0,0,0,0.12));
        }

        .swipe-hint {
            position: absolute;
            bottom: max(20px, env(safe-area-inset-bottom));
            z-index: 2;
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--bg-sand);
            opacity: 0.8;
            animation: floatBounce 2s infinite ease-in-out;
        }

        /* ==========================================
           4. CTA / ACTION LAYER (Parallax-Overlay)
           ========================================== */
        .layer-content {
            background-color: var(--bg-sand);
            background-image: var(--svg-bg-content);
            background-size: cover;
            background-position: top center;
            border-top-left-radius: 30px;
            border-top-right-radius: 30px;
            /* Verstärkter Schatten für räumliche Tiefe über dem Hero */
            box-shadow: 0 -30px 60px rgba(0,0,0,0.3);
            z-index: 3;
        }

        .organic-edge {
            position: absolute;
            top: -50px;
            left: 0;
            width: 100%;
            height: 50px;
            fill: var(--bg-sand);
            pointer-events: none;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 340px;
            z-index: 2;
        }

        .artist-btn {
            display: block;
            width: 100%;
            text-decoration: none;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            -webkit-tap-highlight-color: transparent;
        }

        .artist-btn:hover, .artist-btn:active {
            transform: scale(1.03) translateY(-3px);
        }

        .artist-btn svg {
            width: 100%;
            height: auto;
            filter: drop-shadow(0 8px 16px rgba(0,0,0,0.06));
        }

        .btn-text {
            font-size: 22px;
            font-weight: 600;
        }

        /* ==========================================
           5. MODERN GALERIE-SECTION
           ========================================== */
        .gallery-section {
            background-color: var(--bg-sage);
            z-index: 4;
        }

        .gallery-title {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 25px;
            letter-spacing: -0.5px;
        }

        .gallery-deck {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 900px;
            overflow-x: auto;
            padding: 20px 10px;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .gallery-card {
            flex: 0 0 280px;
            height: 380px;
            background: var(--card-white);
            border-radius: 24px;
            padding: 20px;
            scroll-snap-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        .card-image-placeholder {
            width: 100%;
            height: 200px;
            background: rgba(0,0,0,0.04);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #777;
        }

        /* ==========================================
           6. 2026 SCROLL-DRIVEN ANIMATIONS (Native CSS)
           ========================================== */
        @supports (animation-timeline: view()) {
            
            /* HERO DEPTH EFFECT: Kühlt ab und skaliert beim Verlassen des Viewports */
            .hero-bg, .hero-content {
                animation: depthFade linear both;
                animation-timeline: view();
                animation-range: exit 0% exit 100%;
            }

            @keyframes depthFade {
                100% {
                    transform: scale(0.85) translateY(10vh);
                    opacity: 0.3;
                    filter: brightness(0.3) blur(6px);
                }
            }

            /* ORGANIC MORPH: Die Kante spannt sich beim Scrollen */
            .organic-edge {
                animation: stretchEdge linear both;
                animation-timeline: view();
                animation-range: entry 0% cover 50%;
            }

            @keyframes stretchEdge {
                0% { transform: scaleY(1.5); opacity: 0.8; }
                100% { transform: scaleY(1); opacity: 1; }
            }

            /* SCROLL-REVEAL: Buttons sliden exakt passend zur Scroll-Geschwindigkeit rein */
            .artist-btn:nth-child(1) {
                animation: revealCta linear both;
                animation-timeline: view();
                animation-range: entry 10% cover 40%;
            }

            /* Versetztes Timing (Stagger) für den zweiten Button */
            .artist-btn:nth-child(2) {
                animation: revealCta linear both;
                animation-timeline: view();
                animation-range: entry 20% cover 50%;
            }

            @keyframes revealCta {
                0% {
                    opacity: 0;
                    transform: translateY(80px) scale(0.9);
                }
                100% {
                    opacity: 1;
                    transform: translateY(0) scale(1);
                }
            }
        }

        @keyframes floatBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(8px); }
        }

    </style>
</head>
<body>

    <!-- HERO SECTION -->
    <section class="section hero-section" id="hero">
        <div class="hero-bg" id="hero-bg"></div>
        <div class="hero-content">
            <div class="logo-wrapper">
                <img src="lo.svg" alt="Velo Gourmet Berlin Logo" class="logo-img">
            </div>
        </div>
        <div class="swipe-hint">↓ Wischen</div>
    </section>

    <!-- ACTION / CTA SECTION -->
    <section class="section layer-content" id="navigation">
        <svg class="organic-edge" viewBox="0 0 500 150" preserveAspectRatio="none">
            <path d="M0,0 C150,90 350,-40 500,65 L500,150 L0,150 Z"></path>
        </svg>

        <div class="actions">
            <a href="#galerie" class="artist-btn" aria-label="Mach ma fertig!">
                <svg viewBox="0 0 320 110" xmlns="http://www.w3.org/2000/svg">
                    <path fill="var(--brand-green)" d="M 25,22 C 40,16 110,18 160,15 C 220,12 280,20 298,28 C 310,38 305,68 290,82 C 260,95 180,88 120,94 C 75,98 35,92 18,80 C 8,68 10,35 25,22 Z" />
                    <text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" fill="#1a2e05" class="btn-text">
                        Mach ma fertig!
                    </text>
                </svg>
            </a>

            <a href="#galerie" class="artist-btn" aria-label="Mein Angebot">
                <svg viewBox="0 0 320 110" xmlns="http://www.w3.org/2000/svg">
                    <path fill="var(--brand-rose)" d="M 22,25 C 55,18 130,14 180,18 C 240,21 275,15 295,25 C 308,35 312,65 292,80 C 265,92 195,96 130,90 C 80,86 40,95 20,82 C 5,70 8,38 22,25 Z" />
                    <text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" fill="#3A2325" class="btn-text">
                        Mein Angebot
                    </text>
                </svg>
            </a>
        </div>
    </section>

    <!-- GALERIE SECTION -->
    <section class="section gallery-section" id="galerie">
        <h2 class="gallery-title">Saisonale Impressionen</h2>
        <div class="gallery-deck">
            <div class="gallery-card">
                <div class="card-image-placeholder">Foto: Hermannplatz</div>
                <div class="card-info">
                    <h4>Hermannplatz</h4>
                </div>
            </div>
            <div class="gallery-card">
                <div class="card-image-placeholder">Foto: Prenzlauer Berg</div>
                <div class="card-info">
                    <h4>Prenzlauer Berg</h4>
                </div>
            </div>
        </div>
    </section>

</body>
</html>
