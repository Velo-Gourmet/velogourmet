<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velo Gourmet Berlin</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        
        body {
            font-family: Arial, sans-serif;
            background-color: #FFF9D2;
            color: #333;
            display: flex;
            flex-direction: column;
            padding: 15px;
            min-height: 100dvh;
        }

        .main-content {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            min-height: 100dvh;
        }

        .logo {
            max-width: 220px;
            max-height: 40dvh;
            height: auto;
            object-fit: contain;
            margin-bottom: 15px;
        }

        p {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 25px;
            padding: 0 10px;
        }

        .button-bar {
            display: flex;
            gap: 15px;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
        }

        .btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            text-decoration: none;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .btn-contact { background-color: #27ae60; color: white; }
        .btn-inspiration { background-color: #34495e; color: white; }

        .inspiration-section {
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 0;
        }

        .inspiration-section h2 {
            font-size: 1.4rem;
            margin-bottom: 25px;
            color: #333;
        }

        .collage-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-auto-rows: 150px;
            gap: 15px;
            width: 100%;
            max-width: 600px;
            grid-auto-flow: dense;
        }

        .kachel {
            background-color: #f0ead6;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #777;
            font-size: 0.9rem;
            overflow: hidden;
            position: relative;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .kachel-quer { grid-column: span 2; }
        .kachel-hoch { grid-row: span 2; }
        .kachel img { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; }

        .contact-section {
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 0;
        }

        .contact-section h2 { font-size: 1.4rem; margin-bottom: 25px; color: #333; }
        .contact-links { display: flex; flex-direction: column; gap: 15px; width: 100%; max-width: 400px; }
        
        .contact-btn {
            padding: 15px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            text-decoration: none;
            text-align: center;
            color: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .whatsapp-btn { background-color: #25D366; }
        .insta-btn { background-color: #E1306C; }
        .email-btn { background-color: #2980b9; }

        /* Footer für rechtliche Links */
        .footer {
            margin-top: auto;
            text-align: center;
            padding: 20px 0;
            font-size: 0.8rem;
        }
        .footer a {
            color: #666;
            margin: 0 10px;
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="main-content">
        <img src="1577.png" alt="Velo Gourmet Berlin Logo" class="logo">
        <p>Feinstes Essen, CO2-frei direkt zu dir geliefert.</p>
        
        <div class="button-bar">
            <a href="#kontakt" class="btn btn-contact">Kontakt</a>
            <a href="#inspiration" class="btn btn-inspiration">Inspiration</a>
        </div>
    </div>

    <div id="inspiration" class="inspiration-section">
        <h2>Inspiration</h2>
        <div class="collage-grid">
            <div class="kachel kachel-quer">Bild 1 (Querformat)</div>
            <div class="kachel">Bild 2</div>
            <div class="kachel kachel-hoch">Bild 3 (Hochformat)</div>
            <div class="kachel">Bild 4</div>
            <div class="kachel">Bild 5</div>
        </div>
    </div>

    <div id="kontakt" class="contact-section">
        <h2>Wähle deinen Kanal</h2>
        <div class="contact-links">
            <a href="https://wa.me/DEINE_NUMMER" target="_blank" class="contact-btn whatsapp-btn">WhatsApp / Anrufen</a>
            <a href="https://www.instagram.com/velogourmet" target="_blank" class="contact-btn insta-btn">Instagram</a>
            <a href="mailto:deine-email@example.com" class="contact-btn email-btn">E-Mail schreiben</a>
        </div>
    </div>

    <div class="footer">
        <a href="#impressum">Impressum</a>
        <a href="#datenschutz">Datenschutzerklärung</a>
    </div>

</body>
</html>
